# Not wired. Copy into .github/workflows only on the public repository.
# @changesets/cli is not a dependency yet. Add it, and add
# "release": "changeset tag" to package.json, before enabling this workflow.
# The publish script tags the repo. It does not publish packages to npm.
name: version

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm release
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

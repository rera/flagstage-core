# Not wired. Do not copy this file into .github/workflows.
# It would run. The public repository is where a release workflow belongs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_PUBLIC_ROLE }}
          aws-region: us-east-1
      - uses: docker/login-action@v3
        with:
          registry: public.ecr.aws
          username: ${{ secrets.ECR_PUBLIC_USERNAME }}
          password: ${{ secrets.ECR_PUBLIC_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: public.ecr.aws/flagstage/flagstage-core:${{ github.ref_name }}
      - name: Attach the template
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s|flagstage-core:0.1.0|flagstage-core:${version}|" infra/cloudformation/template.yaml > /tmp/template.yaml
          aws s3 cp /tmp/template.yaml "s3://${RELEASE_BUCKET}/flagstage-core/${version}/template.yaml" --acl public-read
          url="https://s3.amazonaws.com/${RELEASE_BUCKET}/flagstage-core/${version}/template.yaml"
          notes=$(printf '%s\n' "Launch stack: https://us-east-1.console.aws.amazon.com/cloudformation/home?region=us-east-1#/stacks/quickcreate?stackName=flagstage&templateURL=${url}")
          gh release create "$GITHUB_REF_NAME" /tmp/template.yaml --title "$GITHUB_REF_NAME" --notes "$notes"
        env:
          RELEASE_BUCKET: ${{ secrets.RELEASE_BUCKET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
